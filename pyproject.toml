[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsv2"
version = "0.1.0"
description = "Waymo Open Dataset lidar range images to MAE-ST video clips (lidar_sweep_viewer2)"
requires-python = ">=3.12"
dependencies = ["numpy", "pyarrow", "av", "google-cloud-storage", "google-auth"]

[project.scripts]
lsv2 = "lsv2.cli:main"

[tool.setuptools.packages.find]
include = ["lsv2*"]

[tool.basedpyright]
# The bar for this repository: `basedpyright` reports nothing in the editor's default mode.
typeCheckingMode = "recommended"
pythonVersion = "3.12"
include = ["lsv2", "tests", "_bundle"]
reportMissingTypeStubs = false     # google-cloud-storage ships no stubs; its types are inferred from source and cast at the boundary
reportUnusedCallResult = false     # stdlib calls like os.replace and csv.writerow return values nobody reads
